server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://api:8000;
    # The agent's steps stream as Server-Sent Events: don't hold them back in a buffer.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}
