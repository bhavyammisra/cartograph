[project]
name = "cartograph"
version = "0.1.0"
description = "Ask questions about a JavaScript codebase in plain English and get exact file and line answers."
license = "MIT"
authors = [
    { name = "Bhavyam Misra", email = "misrabhavyam@gmail.com" }
]
requires-python = ">=3.12"
readme = "README.md"
keywords = ["code search", "javascript", "typescript", "call graph", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: JavaScript",
    "Topic :: Software Development",
]

dependencies = [
    "bm25s>=0.3.15",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/bhavyammisra/cartograph"
Source = "https://github.com/bhavyammisra/cartograph"
Issues = "https://github.com/bhavyammisra/cartograph/issues"
Changelog = "https://github.com/bhavyammisra/cartograph/blob/main/CHANGELOG.md"

[project.scripts]
cartograph = "cartograph:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src/cartograph"]
ignore_missing_imports = true
