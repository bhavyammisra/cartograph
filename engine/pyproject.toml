[project]
name = "cartograph"
version = "0.1.0"
description = "Ask questions about a JavaScript codebase in plain English and get exact file and line answers."
license = "MIT"
authors = [
    { name = "Bhavyam Misra", email = "misrabhavyam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.14",
    "psycopg[binary]>=3.3.6",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
cartograph = "cartograph:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
